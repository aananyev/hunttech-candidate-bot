[project]
name = "hunttech-candidate-bot"
version = "1.0.0"
description = "HuntTech Candidate Bot — заведение кандидатов в HRM из резюме с проверкой дублей"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hermes Agent", email = "bot@hunttech.ru"}]

dependencies = [
    "aiogram>=3.10.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
database = [
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"